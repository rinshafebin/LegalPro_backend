# Dependency update PRs (against develop, where work happens).
version: 2
updates:
  - package-ecosystem: uv  # updates pyproject.toml and uv.lock together
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker  # base images in backend/Dockerfile
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose  # pinned images in docker-compose.yml
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
