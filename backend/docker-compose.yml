# Local stack: `docker compose up --build`
#   API docs   http://localhost:${API_PORT:-8000}/docs   (set API_PORT if 8000 is taken)
#   MinIO UI   http://localhost:9001  (minioadmin / minioadmin)
#   Mailpit    http://localhost:8025  (catches all outgoing email)

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://app:app@db:5432/advocate
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
    S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: advocate
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d advocate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO stopped publishing community images (Oct 2025); Chainguard ships free builds.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set dev http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing dev/advocate-files &&
        mc anonymous set none dev/advocate-files

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["${API_PORT:-8000}:8000"]
    volumes: ["./app:/app/app", "./alembic:/app/alembic"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["arq", "app.workers.settings.WorkerSettings"]
    volumes: ["./app:/app/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  miniodata:
