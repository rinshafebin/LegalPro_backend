# Run the API as two uvicorn worker processes (no autoreload), to exercise cross-process
# WebSocket fan-out over Redis:
#   docker compose -f docker-compose.yml -f docker/compose.two-workers.yml up -d --build
services:
  api:
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers"]
