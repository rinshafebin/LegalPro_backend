# Run the API with the production command (docker/start-api.sh): two uvicorn workers, no
# autoreload, graceful shutdown. Useful to check cross-worker WebSocket fan-out and metrics:
#   docker compose -f docker-compose.yml -f docker/compose.two-workers.yml up -d --build
services:
  api:
    command: ["/app/docker/start-api.sh"]
    environment:
      WEB_CONCURRENCY: "2"
