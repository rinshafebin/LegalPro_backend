[project]
name = "advocate-backend"
version = "0.1.0"
description = "Advocate & Client Management System API"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "google-auth>=2.63.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "pyjwt>=2.15.1",
    "pyotp>=2.12.1",
    "python-multipart>=0.0.34",
    "qrcode[pil]>=8.2",
    "razorpay>=2.0.1",
    "redis[hiredis]>=7.4.1,<8",
    "requests>=2.34.2",
    "saq[hiredis,redis]>=0.26.5",
    "sqladmin>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx-ws>=0.10.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "T20", "N", "C4", "PT"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["razorpay.*", "pyotp.*", "qrcode.*", "aioboto3.*", "google.*", "arq.*", "sqladmin.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
    "error::sqlalchemy.exc.SADeprecationWarning",
]
